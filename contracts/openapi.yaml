        required:
        - type
        - userId
        properties:
          type:
            type: string
            const: user
          userId:
            type: integer
            minimum: 1
          label:
            type:
            - string
            - 'null'
            maxLength: 120
      - type: object
        additionalProperties: false
        required:
        - type
        - label
        properties:
          type:
            type: string
            enum:
            - customer
            - supplier
            - other
          userId:
            type:
            - integer
            - 'null'
            minimum: 1
          label:
            type: string
            minLength: 1
            maxLength: 120
      description: 'Une attente doit toujours identifier son objet: utilisateur interne ou libellé externe.'
    User:
      type: object
      additionalProperties: false
      required:
      - id
      - email
      - displayName
      - role
      - active
      properties:
        id:
          type: integer
          minimum: 1
        email:
          type: string
          format: email
        displayName:
          type: string
        role:
          $ref: '#/components/schemas/Role'
