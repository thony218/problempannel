      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSimpleReferenceRequest'
      responses:
        '201':
          description: Élément créé.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReferenceResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
  /admin/categories/{resourceId}:
    parameters:
    - name: resourceId
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    patch:
      tags:
      - Admin
      operationId: adminUpdateCategories
      x-rate-limit: write
      requestBody:
        required: true
        content:
          application/json:
            schema:
