      responses:
        '201':
          description: Élément créé.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReferenceResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
  /admin/subcategories/{resourceId}:
    parameters:
    - name: resourceId
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    patch:
      tags:
      - Admin
      operationId: adminUpdateSubcategories
      x-rate-limit: write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSubcategoryRequest'
      responses:
        '200':
          description: Élément modifié.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReferenceResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
components:
  securitySchemes:
    CloudflareAccessJWT:
      type: apiKey
      in: header
      name: Cf-Access-Jwt-Assertion
  parameters:
    PublicId:
      name: publicId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/PublicId'
    UserId:
      name: userId
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    CommentId:
      name: commentId
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    AttachmentId:
      name: attachmentId
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    ActionId:
      name: actionId
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    Cursor:
      name: cursor
      in: query
      schema:
        type:
        - string
        - 'null'
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema:
        type: string
    DateFrom:
      name: from
      in: query
      schema:
        type: string
        format: date
    DateTo:
      name: to
      in: query
      schema:
        type: string
        format: date
    LocationIdQuery:
      name: locationId
      in: query
      schema:
        type: integer
        minimum: 1
    DepartmentIdQuery:
      name: departmentId
      in: query
      schema:
        type: integer
        minimum: 1
    CategoryIdQuery:
      name: categoryId
      in: query
      schema:
        type: integer
        minimum: 1
    EffectivenessReviewDueBefore:
      name: effectivenessReviewDueBefore
      in: query
      schema:
        type: string
        format: date
      description: Retourne les dossiers pending dont la date de revue est <= à cette date.
  schemas:
    PublicId:
      type: string
      pattern: ^INC-[0-9]{6,}$
      example: INC-000042
      description: 'Numéro de dossier unique dérivé de l''ID D1 global: INC-{id sur au moins 6 chiffres}. Ce numéro
        n''est ni un compteur annuel ni une date.'
    Role:
      type: string
      enum:
      - employee
      - manager
      - admin
    IssueStatus:
      type: string
      enum:
      - new
      - inProgress
      - waiting
      - resolved
    Priority:
      type: string
      enum:
      - normal
      - important
      - urgent
    CauseStatus:
      type: string
      enum:
      - toVerify
      - known
    EffectivenessStatus:
      type: string
      enum:
      - pending
      - effective
      - ineffective
    CorrectiveActionStatus:
      type: string
      enum:
      - todo
      - inProgress
      - waiting
      - done
    PermanentCorrectionType:
      type: string
      enum:
      - procedureUpdate
      - newProcedure
      - training
      - systemConfiguration
      - responsibilityChange
      - additionalCheck
      - supplierProcess
      - noChangeRequired
      - other
    WaitingOn:
