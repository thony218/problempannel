      responses:
        '200':
          description: Élément modifié.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReferenceResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
  /admin/categories:
    get:
      tags:
      - Admin
      operationId: adminListCategories
      responses:
        '200':
          description: Référentiel.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReferenceListResponse'
        '403':
