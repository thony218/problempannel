openapi: 3.1.0
info:
  title: Registre des erreurs API
  version: 1.0.0
  description: Contrat API officiel de la V1.
servers:
- url: /api
security:
- CloudflareAccessJWT: []
tags:
- name: Session
- name: Meta
- name: Issues
- name: Comments
- name: Attachments
- name: CorrectiveActions
- name: History
- name: Links
- name: Analytics
- name: Admin
paths:
  /health:
    get:
      security: []
      tags:
      - Session
      operationId: getHealth
      responses:
        '200':
          description: Worker opérationnel.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /me:
    get:
      tags:
      - Session
      operationId: getMe
      responses:
        '200':
          description: Utilisateur courant.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /meta:
    get:
      tags:
      - Meta
      operationId: getMeta
      responses:
        '200':
          description: Référentiels actifs et configuration client.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetaResponse'
  /issues:
    get:
      tags:
      - Issues
      operationId: listIssues
      parameters:
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/Limit'
      - name: q
        in: query
        schema:
          type: string
          minLength: 2
          maxLength: 40
        x-maxUtf8Bytes: 160
      - name: status
        in: query
        schema:
          type: array
          items:
            $ref: '#/components/schemas/IssueStatus'
        style: form
        explode: true
      - name: priority
        in: query
        schema:
          type: array
          items:
            $ref: '#/components/schemas/Priority'
        style: form
        explode: true
      - $ref: '#/components/parameters/LocationIdQuery'
      - $ref: '#/components/parameters/DepartmentIdQuery'
      - $ref: '#/components/parameters/CategoryIdQuery'
      - name: ownerUserId
        in: query
        schema:
          type: integer
          minimum: 1
      - name: from
        in: query
        schema:
          type: string
          format: date
      - name: to
        in: query
        schema:
          type: string
          format: date
      - name: overdue
        in: query
        schema:
          type: boolean
      - name: effectivenessStatus
        in: query
        schema:
          $ref: '#/components/schemas/EffectivenessStatus'
      - $ref: '#/components/parameters/EffectivenessReviewDueBefore'
      responses:
        '200':
          description: Liste paginée.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IssueListResponse'
        '422':
          $ref: '#/components/responses/ValidationError'
    post:
      tags:
      - Issues
      operationId: createIssue
      x-rate-limit: write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateIssueRequest'
      responses:
        '201':
          description: Dossier créé.
          headers:
            ETag:
              required: true
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IssueResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
  /issues/{publicId}:
    parameters:
    - $ref: '#/components/parameters/PublicId'
    get:
      tags:
      - Issues
      operationId: getIssue
      responses:
        '200':
          description: Détail cœur, impacts et actions correctives.
          headers:
            ETag:
              required: true
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IssueDetailResponse'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags:
      - Issues
      operationId: updateIssue
      x-rate-limit: write
      parameters:
      - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateIssueRequest'
      responses:
        '200':
          description: Dossier modifié.
          headers:
            ETag:
              required: true
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IssueDetailResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
        '429':
          $ref: '#/components/responses/RateLimited'
  /issues/{publicId}/comments:
    parameters:
    - $ref: '#/components/parameters/PublicId'
    get:
      tags:
      - Comments
      operationId: listComments
      parameters:
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Commentaires paginés.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommentListResponse'
    post:
      tags:
      - Comments
      operationId: createComment
      x-rate-limit: write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - body
              properties:
                body:
                  type: string
                  minLength: 1
                  maxLength: 4000
      responses:
        '201':
          description: Commentaire créé.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommentResponse'
        '422':
          $ref: '#/components/responses/ValidationError'
  /comments/{commentId}:
    parameters:
    - $ref: '#/components/parameters/CommentId'
    delete:
      tags:
      - Comments
      operationId: deleteComment
      x-rate-limit: write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - reason
              properties:
                reason:
                  type: string
                  minLength: 5
                  maxLength: 500
      responses:
        '204':
          description: Soft-delete effectué.
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /issues/{publicId}/attachments:
    parameters:
    - $ref: '#/components/parameters/PublicId'
    get:
      tags:
      - Attachments
      operationId: listAttachments
      responses:
        '200':
          description: Pièces jointes actives.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttachmentListResponse'
    post:
      tags:
      - Attachments
      operationId: uploadAttachment
      x-rate-limit: upload
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - file
              properties:
                file:
                  type: string
                  format: binary
                  description: Max 10 MiB; JPEG, PNG, WebP, HEIC, HEIF ou PDF.
      responses:
        '201':
          description: Fichier stocké.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttachmentResponse'
        '413':
          $ref: '#/components/responses/FileTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedFileType'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
      x-allowed-content-types:
      - image/jpeg
      - image/png
      - image/webp
      - image/heic
      - image/heif
      - application/pdf
  /attachments/{attachmentId}:
    parameters:
    - $ref: '#/components/parameters/AttachmentId'
    get:
      tags:
      - Attachments
      operationId: downloadAttachment
      responses:
        '200':
          description: Contenu du fichier autorisé.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags:
      - Attachments
      operationId: deleteAttachment
      x-rate-limit: write
      responses:
        '204':
          description: Soft-delete effectué.
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /issues/{publicId}/corrective-actions:
    parameters:
    - $ref: '#/components/parameters/PublicId'
    get:
      tags:
      - CorrectiveActions
      operationId: listCorrectiveActions
      responses:
        '200':
          description: Actions correctives.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CorrectiveActionListResponse'
    post:
      tags:
      - CorrectiveActions
      operationId: createCorrectiveAction
      x-rate-limit: write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCorrectiveActionRequest'
      responses:
        '201':
          description: Action créée.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CorrectiveActionResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
  /corrective-actions/{actionId}:
    parameters:
    - $ref: '#/components/parameters/ActionId'
    get:
      tags:
      - CorrectiveActions
      operationId: getCorrectiveAction
      responses:
        '200':
          description: Action corrective.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CorrectiveActionResponse'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags:
      - CorrectiveActions
      operationId: updateCorrectiveAction
      x-rate-limit: write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCorrectiveActionRequest'
      responses:
        '200':
          description: Action modifiée.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CorrectiveActionResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
  /issues/{publicId}/history:
    parameters:
    - $ref: '#/components/parameters/PublicId'
    get:
      tags:
      - History
      operationId: listIssueHistory
      parameters:
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Historique append-only.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HistoryListResponse'
  /issues/{publicId}/links:
    parameters:
    - $ref: '#/components/parameters/PublicId'
    get:
      tags:
      - Links
      operationId: listIssueLinks
      responses:
        '200':
          description: Cas liés.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LinkListResponse'
    post:
      tags:
      - Links
      operationId: createIssueLink
      x-rate-limit: write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - relatedPublicId
              properties:
                relatedPublicId:
                  $ref: '#/components/schemas/PublicId'
      responses:
        '201':
          description: Lien similar créé.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LinkResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
  /issues/{publicId}/links/{relatedPublicId}:
    parameters:
    - $ref: '#/components/parameters/PublicId'
    - name: relatedPublicId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/PublicId'
    delete:
      tags:
      - Links
      operationId: deleteIssueLink
      x-rate-limit: write
      responses:
        '204':
          description: Lien supprimé.
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /analytics/summary:
    get:
      tags:
      - Analytics
      operationId: getAnalyticsSummary
      parameters:
      - $ref: '#/components/parameters/DateFrom'
      - $ref: '#/components/parameters/DateTo'
      - $ref: '#/components/parameters/LocationIdQuery'
      - $ref: '#/components/parameters/DepartmentIdQuery'
      - $ref: '#/components/parameters/CategoryIdQuery'
      responses:
        '200':
          description: KPI de synthèse.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalyticsSummaryResponse'
  /analytics/recurring:
    get:
      tags:
      - Analytics
      operationId: getRecurringIssues
      parameters:
      - $ref: '#/components/parameters/LocationIdQuery'
      - $ref: '#/components/parameters/DepartmentIdQuery'
      - $ref: '#/components/parameters/CategoryIdQuery'
      responses:
        '200':
          description: Groupes récurrents.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecurringResponse'
      description: Retourne les récurrences locales (location+subcategory) et organisationnelles (subcategory) selon
        seuil 3/90 jours.
  /analytics/effectiveness:
    get:
      tags:
      - Analytics
      operationId: getEffectiveness
      parameters:
      - $ref: '#/components/parameters/DateFrom'
      - $ref: '#/components/parameters/DateTo'
      responses:
        '200':
          description: Efficacité des corrections.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EffectivenessResponse'
      description: Agrège uniquement issues.effectiveness_status; les actions correctives sont exclues du KPI principal.
  /admin/users:
    get:
      tags:
      - Admin
      operationId: adminListUsers
      responses:
        '200':
          description: Utilisateurs.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserListResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags:
      - Admin
      operationId: adminCreateUser
      x-rate-limit: write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
      responses:
        '201':
          description: Utilisateur créé.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
  /admin/users/{userId}:
    parameters:
    - $ref: '#/components/parameters/UserId'
    patch:
      tags:
      - Admin
      operationId: adminUpdateUser
      x-rate-limit: write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRequest'
      responses:
        '200':
          description: Utilisateur modifié.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /admin/issues/{publicId}/redact:
    parameters:
    - $ref: '#/components/parameters/PublicId'
    post:
      tags:
      - Admin
      operationId: adminRedactIssue
      x-rate-limit: write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RedactIssueRequest'
      responses:
        '200':
          description: Caviardage appliqué.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IssueResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
  /admin/locations:
    get:
      tags:
      - Admin
      operationId: adminListLocations
      responses:
        '200':
          description: Référentiel.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReferenceListResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags:
      - Admin
      operationId: adminCreateLocations
      x-rate-limit: write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSimpleReferenceRequest'
      responses:
        '201':
          description: Élément créé.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReferenceResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
  /admin/locations/{resourceId}:
    parameters:
    - name: resourceId
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    patch:
      tags:
      - Admin
      operationId: adminUpdateLocations
      x-rate-limit: write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSimpleReferenceRequest'
      responses:
        '200':
          description: Élément modifié.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReferenceResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
  /admin/departments:
    get:
      tags:
      - Admin
      operationId: adminListDepartments
      responses:
        '200':
          description: Référentiel.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReferenceListResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags:
      - Admin
      operationId: adminCreateDepartments
      x-rate-limit: write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSimpleReferenceRequest'
      responses:
        '201':
          description: Élément créé.
          content:
