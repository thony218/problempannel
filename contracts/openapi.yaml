        ok:
          type: boolean
          const: true
        data:
          type: array
          items:
            $ref: '#/components/schemas/ReferenceItem'
    RedactIssueRequest:
      type: object
      additionalProperties: false
      required:
      - reason
      properties:
        issueTextFields:
          type: array
          uniqueItems: true
          items:
            type: string
            enum:
            - description
            - causeSummary
            - immediateSolution
            - permanentCorrectionSummary
            - finalResult
            - preventionLearning
          minItems: 1
        commentIds:
          type: array
          uniqueItems: true
          items:
            type: integer
            minimum: 1
          minItems: 1
        attachmentIds:
          type: array
          uniqueItems: true
          items:
            type: integer
            minimum: 1
          minItems: 1
        reason:
          type: string
          minLength: 5
          maxLength: 1000
      description: Opération R2/admin. Au moins une cible non vide est obligatoire. Les textes ciblés sont remplacés
        par une valeur neutre; les fichiers ciblés sont retirés de R2; l'historique n'enregistre jamais les anciennes
        valeurs libres.
      anyOf:
      - required:
        - issueTextFields
      - required:
        - commentIds
      - required:
        - attachmentIds
    CreateSimpleReferenceRequest:
      type: object
      additionalProperties: false
      required:
      - code
      - label
      properties:
        code:
          type: string
          pattern: ^[a-z0-9_]+$
          maxLength: 80
        label:
          type: string
          minLength: 1
          maxLength: 200
        sortOrder:
          type: integer
          default: 100
    UpdateSimpleReferenceRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        label:
          type: string
          minLength: 1
          maxLength: 200
        sortOrder:
          type: integer
        active:
          type: boolean
    CreateSubcategoryRequest:
      type: object
      additionalProperties: false
      required:
      - categoryId
      - code
      - label
      properties:
        categoryId:
          type: integer
          minimum: 1
        code:
          type: string
          pattern: ^[a-z0-9_]+$
          maxLength: 80
        label:
          type: string
          minLength: 1
          maxLength: 200
        sortOrder:
          type: integer
          default: 100
    UpdateSubcategoryRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        categoryId:
          type: integer
          minimum: 1
        label:
          type: string
          minLength: 1
          maxLength: 200
        sortOrder:
          type: integer
        active:
          type: boolean
  responses:
    BadRequest:
      description: Requête mal formée.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorBody'
    Unauthorized:
      description: Non authentifié.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorBody'
    Forbidden:
      description: Interdit.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorBody'
    NotFound:
      description: Introuvable.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorBody'
    Conflict:
      description: Version périmée.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorBody'
    ValidationError:
      description: Validation métier.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorBody'
    PreconditionRequired:
      description: If-Match manquant.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorBody'
    FileTooLarge:
      description: Fichier supérieur à 10 MiB.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorBody'
    UnsupportedFileType:
      description: 'MIME non permis. Types V1: JPEG, PNG, WebP, HEIC, HEIF et PDF.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorBody'
    RateLimited:
      description: Limite de débit dépassée.
      headers:
        Retry-After:
          schema:
            type: integer
            example: 60
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorBody'
