        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
  /admin/impact-types:
    get:
      tags:
      - Admin
      operationId: adminListImpactTypes
      responses:
        '200':
          description: Référentiel.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReferenceListResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags:
      - Admin
      operationId: adminCreateImpactTypes
      x-rate-limit: write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSimpleReferenceRequest'
      responses:
        '201':
          description: Élément créé.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReferenceResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
